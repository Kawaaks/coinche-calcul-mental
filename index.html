<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5138">
<title>Coinche Calcul Mental</title>
<style>
:root{
  --bg:#083c2b; --panel:#0e5b40; --cream:#fff9e8; --ink:#17231d;
  --gold:#f1c75b; --red:#c9353b; --green:#19a974; --muted:#c9ddd4;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:white;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:
    radial-gradient(circle at 50% 5%,#167453 0,transparent 35%),
    linear-gradient(145deg,#062d21,#0a5139);
  display:flex; justify-content:center;
}
.app{width:min(100%,560px);padding:18px 16px 34px}
h1{font-size:clamp(1.55rem,6vw,2.25rem);margin:5px 0 4px;text-align:center}
.subtitle{text-align:center;color:var(--muted);margin:0 0 18px}
.panel{
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
  border-radius:22px; padding:16px; box-shadow:0 16px 45px rgba(0,0,0,.25);
  backdrop-filter:blur(8px)
}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{
  border:0;border-radius:14px;padding:13px 10px;font-weight:800;font-size:.95rem;
  cursor:pointer;touch-action:manipulation
}
.mode{background:#e8f2ed;color:#164936}
.mode.active{background:var(--gold);color:#3c2d00;box-shadow:0 0 0 3px rgba(241,199,91,.25)}
.info{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 2px 8px;color:var(--muted);font-weight:700}
.info-left{display:flex;flex-direction:column;gap:2px;min-width:0}
.value-toggle{
  margin-left:auto;background:rgba(255,255,255,.14);color:white;
  padding:9px 11px;border:1px solid rgba(255,255,255,.18);
  font-size:.8rem;white-space:nowrap
}
.value-toggle[aria-pressed="false"]{background:var(--gold);color:#352800}
.value-pill.hidden-value{visibility:hidden}
.card-zone{display:grid;place-items:center;min-height:300px}
.card{
  width:180px;height:252px;background:var(--cream);color:var(--ink);border-radius:18px;
  border:5px solid white;box-shadow:0 18px 35px rgba(0,0,0,.35);
  display:flex;flex-direction:column;justify-content:space-between;padding:15px;
  user-select:none
}
.card.red{color:var(--red)}
.corner{font-weight:900;font-size:2rem;line-height:.88}
.corner.bottom{transform:rotate(180deg);align-self:flex-end}
.suit{font-size:5rem;text-align:center;line-height:1}
.value-pill{
  align-self:center;background:#132b22;color:white;border-radius:999px;
  padding:7px 13px;font-weight:900;font-size:1rem
}
.controls{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
input{
  min-width:0;border:0;border-radius:14px;padding:15px;font-size:1.2rem;font-weight:800;
  text-align:center;background:white;color:#14241d
}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.key{background:#f3f7f5;color:#163d2e;font-size:1.1rem;padding:14px 8px}
.key.action{background:rgba(255,255,255,.16);color:white}
.key.validate{background:var(--gold);color:#352800}
.feedback{min-height:46px;text-align:center;font-weight:800;padding:12px 5px 0}
.feedback.ok{color:#85f0bd}.feedback.bad{color:#ffb0b0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:rgba(0,0,0,.18);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.35rem}.stat span{font-size:.78rem;color:var(--muted)}
.actions{display:flex;gap:9px;margin-top:13px}
.primary{flex:1;background:#fff;color:#154b36}
.secondary{background:rgba(255,255,255,.14);color:white}
.help{font-size:.88rem;color:var(--muted);line-height:1.45;margin-top:14px}
.hidden{display:none!important}
.finish{text-align:center;padding:28px 10px}
.finish .big{font-size:3rem;margin:0}
@media(max-width:390px){
  .card{width:150px;height:210px}
  .card-zone{min-height:230px}
  .mode{font-size:.8rem;padding:11px 5px}
  .key{padding:12px 8px}
}
</style>
</head>
<body>
<main class="app">
  <h1>🃏 Coinche Calcul Mental</h1>
  <p class="subtitle">Additionne les cartes sans perdre le fil.</p>

  <section class="panel">
    <div id="setup">
      <div class="mode-grid">
        <button class="mode active" data-mode="classic">Classique</button>
        <button class="mode" data-mode="all">Tout atout</button>
        <button class="mode" data-mode="none">Sans atout</button>
      </div>
      <div class="help" id="modeHelp">
        Une couleur d’atout est tirée au hasard. Les cartes valent 152 points, puis le dix de der porte le total à 162.
      </div>
      <div class="actions">
        <button class="primary" id="startBtn">Commencer la partie</button>
      </div>
    </div>

    <div id="game" class="hidden">
      <div class="info">
        <div class="info-left">
          <span id="modeLabel"></span>
          <span id="progress"></span>
        </div>
        <button class="value-toggle" id="valueToggle" type="button" aria-pressed="true">
          👁 Valeurs visibles
        </button>
      </div>

      <div class="card-zone">
        <div class="card" id="card">
          <div class="corner" id="topCorner"></div>
          <div>
            <div class="suit" id="bigSuit"></div>
            <div class="value-pill" id="valuePill"></div>
          </div>
          <div class="corner bottom" id="bottomCorner"></div>
        </div>
      </div>

      <div class="controls">
        <input id="answer" type="text" readonly aria-label="Nouveau cumul" placeholder="Nouveau cumul">
        <div class="keypad" aria-label="Pavé numérique">
          <button class="key" type="button" data-key="7">7</button>
          <button class="key" type="button" data-key="8">8</button>
          <button class="key" type="button" data-key="9">9</button>
          <button class="key" type="button" data-key="4">4</button>
          <button class="key" type="button" data-key="5">5</button>
          <button class="key" type="button" data-key="6">6</button>
          <button class="key" type="button" data-key="1">1</button>
          <button class="key" type="button" data-key="2">2</button>
          <button class="key" type="button" data-key="3">3</button>
          <button class="key action" type="button" id="clearBtn">C</button>
          <button class="key" type="button" data-key="0">0</button>
          <button class="key action" type="button" id="backspaceBtn">⌫</button>
          <button class="key validate" type="button" id="submitBtn" style="grid-column:1/-1">✓ Valider</button>
        </div>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="stats">
        <div class="stat"><b id="score">0</b><span>bonnes réponses</span></div>
        <div class="stat"><b id="errors">0</b><span>erreurs</span></div>
        <div class="stat"><b id="streak">0</b><span>série</span></div>
      </div>
      <div class="actions">
        <button class="secondary" id="quitBtn">Recommencer</button>
      </div>
    </div>

    <div id="finish" class="finish hidden">
      <p class="big">🏆</p>
      <h2>Partie terminée</h2>
      <p id="finishText"></p>
      <button class="primary" id="againBtn">Nouvelle partie</button>
    </div>
  </section>
</main>

<script>
const suits = [
  {name:"Trèfle", symbol:"♣", red:false},
  {name:"Carreau", symbol:"♦", red:true},
  {name:"Cœur", symbol:"♥", red:true},
  {name:"Pique", symbol:"♠", red:false}
];
const ranks = ["7","8","9","10","V","D","R","A"];
const classicTrump = {"7":0,"8":0,"9":14,"10":10,"V":20,"D":3,"R":4,"A":11};
const classicPlain = {"7":0,"8":0,"9":0,"10":10,"V":2,"D":3,"R":4,"A":11};
const noTrump = {"7":0,"8":0,"9":0,"10":10,"V":2,"D":3,"R":4,"A":19};
const allTrump = {"7":0,"8":0,"9":14,"10":10,"V":20,"D":3,"R":4,"A":11};

let selectedMode="classic", deck=[], index=0, cumulative=0, correct=0, errors=0, streak=0, trump=null;
let startTime=null,endTime=null;
let valuesVisible = localStorage.getItem("coincheValuesVisible") !== "false";
let locked=false;

const $ = id => document.getElementById(id);

document.querySelectorAll(".mode").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".mode").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    selectedMode=btn.dataset.mode;
    const texts={
      classic:"Une couleur d’atout est tirée au hasard. Les cartes valent 152 points, puis le dix de der porte le total à 162.",
      all:"Toutes les couleurs sont atout. Le paquet vaut 248 points, puis 258 avec le dix de der. Le résultat final est aussi affiché converti sur 162.",
      none:"Aucun atout. Les As valent 19 points : 152 points dans les cartes, puis 162 avec le dix de der."
    };
    $("modeHelp").textContent=texts[selectedMode];
  });
});

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function makeDeck(){
  trump = selectedMode==="classic" ? suits[Math.floor(Math.random()*4)] : null;
  const d=[];
  suits.forEach(s=>ranks.forEach(r=>{
    let value;
    if(selectedMode==="classic") value=(s===trump?classicTrump:classicPlain)[r];
    else if(selectedMode==="none") value=noTrump[r];
    else value=allTrump[r];
    d.push({suit:s,rank:r,value});
  }));
  shuffle(d);
  d.push({bonus:true,rank:"+10",value:10,suit:{name:"Dix de der",symbol:"★",red:false}});
  return d;
}

function updateValueVisibility(){
  $("valuePill").classList.toggle("hidden-value", !valuesVisible);
  $("valueToggle").setAttribute("aria-pressed", String(valuesVisible));
  $("valueToggle").textContent = valuesVisible ? "👁 Valeurs visibles" : "🙈 Valeurs cachées";
  localStorage.setItem("coincheValuesVisible", String(valuesVisible));
}

function start(){
  deck=makeDeck();
  index=0;
  cumulative=0;
  correct=0;
  errors=0;
  streak=0;
  locked=false;
  startTime=null;
  endTime=null;

  $("setup").classList.add("hidden");
  $("finish").classList.add("hidden");
  $("game").classList.remove("hidden");

  const labels={
    classic:`Classique · Atout ${trump.symbol} ${trump.name}`,
    all:"Tout atout",
    none:"Sans atout"
  };
  $("modeLabel").textContent=labels[selectedMode];
  updateStats();
  showCard();
}

function showCard(){
  if(index>=deck.length){
    finish();
    return;
  }

  const c=deck[index];
  $("card").classList.toggle("red",c.suit.red);
  $("topCorner").textContent=`${c.rank} ${c.suit.symbol}`;
  $("bottomCorner").textContent=`${c.rank} ${c.suit.symbol}`;
  $("bigSuit").textContent=c.suit.symbol;
  $("valuePill").textContent=c.bonus ? "Bonus du dernier pli : 10" : `Valeur : ${c.value}`;
  updateValueVisibility();
  $("progress").textContent=`${index+1} / ${deck.length}`;
  $("answer").value="";
  $("feedback").textContent="";
  $("feedback").className="feedback";
}

function validate(){
  if(locked) return;

  const raw=$("answer").value.trim();
  if(raw==="") return;

  const given=Number(raw);
  const expected=cumulative+deck[index].value;
  if(!Number.isFinite(given)) return;

  if(Math.abs(given-expected)<0.001){
    if(startTime===null) startTime=Date.now();

    correct++;
    streak++;
    cumulative=expected;
    $("feedback").textContent=`Exact ! Cumul : ${cumulative}`;
    $("feedback").className="feedback ok";
    locked=true;
    updateStats();

    setTimeout(()=>{
      index++;
      locked=false;
      showCard();
    },250);
  }else{
    errors++;
    streak=0;
    $("feedback").textContent="Pas tout à fait. Essaie encore.";
    $("feedback").className="feedback bad";
    updateStats();
  }
}

function updateStats(){
  $("score").textContent=correct;
  $("errors").textContent=errors;
  $("streak").textContent=streak;
}

function finish(){
  endTime=Date.now();
  $("game").classList.add("hidden");
  $("finish").classList.remove("hidden");

  const total=selectedMode==="all"?258:162;
  const conversion=selectedMode==="all"?" Après conversion officielle : 162 / 162.":"";
  const elapsed=startTime ? Math.floor((endTime-startTime)/1000) : 0;
  const min=Math.floor(elapsed/60);
  const sec=String(elapsed%60).padStart(2,"0");

  $("finishText").innerHTML=
    `Total obtenu : <b>${total}</b>.${conversion}<br>`+
    `<b>Temps : ${min}:${sec}</b><br>`+
    `${correct} bonnes réponses et ${errors} erreur${errors>1?"s":""}.`;
}

$("valueToggle").addEventListener("click",()=>{
  valuesVisible=!valuesVisible;
  updateValueVisibility();
});

document.querySelectorAll("[data-key]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(locked) return;
    if($("answer").value.length<4){
      $("answer").value += btn.dataset.key;
    }
  });
});

$("clearBtn").addEventListener("click",()=>{
  if(!locked) $("answer").value="";
});

$("backspaceBtn").addEventListener("click",()=>{
  if(!locked) $("answer").value=$("answer").value.slice(0,-1);
});

$("submitBtn").addEventListener("click",validate);

document.addEventListener("keydown",e=>{
  if($("game").classList.contains("hidden") || locked) return;

  if(/^\d$/.test(e.key)){
    e.preventDefault();
    if($("answer").value.length<4) $("answer").value += e.key;
  }else if(e.key==="Backspace"){
    e.preventDefault();
    $("answer").value=$("answer").value.slice(0,-1);
  }else if(e.key==="Escape"){
    e.preventDefault();
    $("answer").value="";
  }else if(e.key==="Enter"){
    e.preventDefault();
    validate();
  }
});

$("startBtn").addEventListener("click",start);
$("quitBtn").addEventListener("click",()=>{
  $("game").classList.add("hidden");
  $("setup").classList.remove("hidden");
});
$("againBtn").addEventListener("click",()=>{
  $("finish").classList.add("hidden");
  $("setup").classList.remove("hidden");
});
</script>
</body>
</html>
